[build]
command = "npm run build"
publish = "dist"

# Every page is prerendered to its own HTML file, e.g. dist/cybersecurity.html for /cybersecurity (scripts/prerender.mjs), so only unknown URLs
# reach this rule, and they get the 404 page with a real 404 status.
[[redirects]]
from = "/*"
to = "/404.html"
status = 404
