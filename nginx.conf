server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 1024;

    # /cybersecurity/ -> /cybersecurity (canonical URLs have no trailing slash)
    rewrite ^/(.+)/$ /$1 permanent;

    # Prerendered pages are flat files: /cybersecurity -> cybersecurity.html.
    # Unknown URLs get the prerendered 404 page with a real 404 status (replaces Netlify's _redirects).
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Hashed Vite assets never change — cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
